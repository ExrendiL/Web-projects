<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency-converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="details">
            <h1 class="app-title">Currency converter</h1>
        </div>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" value="">
        <div class="dropdowns">
            <select id="from-currency-select"></select>
            <button id="switch-button">↔</button>
            <select id="to-currency-select"></select>
        </div>
        <button id="convert-button">Convert</button>
        <p id="result"></p>
    </div>
    <script src="currency-codes.js"></script>
    <script src="api-key.js"></script>
    <script src="currency-converter.js"></script>
</body>
</html>
